name: build

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Add PostgreSQL apt repository (pgdg)
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=-
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo install -d /tmp/pgorca-apt-sources
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/pgorca-apt-sources/
          sudo cp /etc/apt/sources.list.d/pgdg.list /tmp/pgorca-apt-sources/
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/dev/null \
            -o Dir::Etc::sourceparts=/tmp/pgorca-apt-sources

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get install -y \
            postgresql-server-dev-18 \
            libxerces-c-dev \
            uuid-dev \
            default-jre-headless \
            cmake \
            ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Show toolchain versions
        run: |
          set -eux
          /usr/lib/postgresql/18/bin/pg_config --version
          cmake --version
          ninja --version
          java -version
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            clang --version
          else
            gcc --version
          fi

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPG_CONFIG=/usr/lib/postgresql/18/bin/pg_config

      - name: Build
        run: cmake --build build -j "$(nproc)"

  ml-orca-tests:
    name: ML-ORCA / encoding + networks + objectives
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ml-orca/requirements*.txt
      - name: Install CPU training dependencies
        run: |
          python3 -m pip install -e tools/ml-orca
          python3 -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Test ml-orca component without PostgreSQL or private data
        run: |
          python3 -c 'import torch; print(torch.__version__)'
          python3 -B -m unittest discover -s tools/ml-orca/ml_orca/tests -t tools/ml-orca
          python3 -m ml_orca --help

  dsl-tests:
    name: ubuntu-24.04 / DSL unit + ON/OFF E2E
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ml-orca/requirements.txt

      - name: Add PostgreSQL apt repository (pgdg)
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=-
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo install -d /tmp/pgorca-apt-sources
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/pgorca-apt-sources/
          sudo cp /etc/apt/sources.list.d/pgdg.list /tmp/pgorca-apt-sources/
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/dev/null \
            -o Dir::Etc::sourceparts=/tmp/pgorca-apt-sources

      - name: Install build and test dependencies
        run: |
          sudo apt-get install -y \
            postgresql-18 \
            postgresql-server-dev-18 \
            libxerces-c-dev \
            uuid-dev \
            default-jre-headless \
            cmake \
            ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG=/usr/lib/postgresql/18/bin/pg_config

      - name: Build DSL tests and extension
        run: |
          cmake --build build --target gpopt_dsl_test pg_orca pgorca_rule_audit -j "$(nproc)"

      - name: Run DSL unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^gpopt_dsl_test$'

      - name: Run trace framework self-tests
        run: |
          python3 -m pip install -e tools/ml-orca
          python3 test/dsl/test_trace_framework.py

      - name: Install extension
        run: sudo cmake --install build

      - name: Run DSL OFF/ON end-to-end tests
        env:
          PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
        run: |
          test/dsl/e2e.sh
          test/dsl/e2e.sh --suite expression_bindings
          test/dsl/e2e.sh --suite mixed_comparison
          test/dsl/e2e.sh --suite projection_bindings
          test/dsl/e2e.sh --suite capture_references
          test/dsl/e2e.sh --suite select_items
          test/dsl/e2e.sh --suite not_true_bindings
          test/dsl/e2e.sh --suite join_expression_bindings
          test/dsl/e2e.sh --suite apply_bindings
          test/dsl/e2e.sh --suite surface_equality
          test/dsl/e2e.sh --suite slice_compose
          test/dsl/e2e.sh --suite quantified_support

      - name: Run public real-SQL trace corpus
        run: |
          python3 -m ml_orca.collect.run_trace_corpus \
            test/dsl/corpus/calcite/framework_cases.jsonl \
            test/dsl/rules/framework.rules \
            test/dsl/corpus/calcite/schema.sql \
            --pg-config /usr/lib/postgresql/18/bin/pg_config \
            --output-dir build/dsl-corpus

      - name: Verify CTE execution without semantic rewrites
        env:
          PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
          DSL_E2E_OUTPUT_DIR: output/cte-execution-contract
        run: |
          build/pgorca_rule_audit test/dsl/audit output/cte-execution-contract/audit
          python3 tools/pgorca_rule_audit/test_features.py build/pgorca_rule_audit
          test/dsl/e2e.sh --disable-semantic-xforms output/cte-execution-contract/audit/coverage.json \
            -t cte_sequence_no_inline_columns -t cte_sequence_no_inline_empty \
            -t cte_sequence_no_inline_multi -t cte_sequence_no_inline_nested \
            -t cte_sequence_no_inline_volatile -t cte_sequence_no_inline_rescan

      - name: Upload DSL E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dsl-e2e-results
          path: |
            output/dsl-e2e/
            test/dsl/e2e/output/
            test/dsl/e2e/diff/
            build/dsl-corpus/
            output/cte-execution-contract/

  build-centos:
    name: centos-stream9 / gcc / Debug + tests
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9

    steps:
      - name: Install OS packages
        run: |
          set -eux
          # ninja-build lives in CRB (CodeReady Builder), perl-IPC-Run in EPEL.
          dnf -y install dnf-plugins-core epel-release
          dnf -y config-manager --set-enabled crb
          dnf -qy module disable postgresql
          dnf -y install \
            https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
          dnf -y install \
            postgresql18 postgresql18-server postgresql18-devel \
            xerces-c-devel \
            libuuid-devel \
            cmake ninja-build gcc-c++ \
            java-17-openjdk-headless \
            git diffutils \
            perl perl-IPC-Run

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          set -eux
          /usr/pgsql-18/bin/pg_config --version
          cmake --version
          ninja --version
          java -version
          gcc --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG=/usr/pgsql-18/bin/pg_config

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Run ORCA tests (--orca-tests)
        # pg_regress's --temp-instance calls initdb, which refuses to run as
        # root. Create a regular user, hand over the workspace, and re-exec.
        run: |
          set -eux
          useradd -m runner
          chown -R runner:runner "$GITHUB_WORKSPACE"
          runuser -u runner -- bash -c '
            set -eux
            export PATH=/usr/pgsql-18/bin:$PATH
            cd "$GITHUB_WORKSPACE"
            test/test.sh --orca-tests
          '

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: centos-test-results
          path: |
            build/test_parallel/
            build/tmp_check_parallel/log/

  build-rocky:
    name: rockylinux:9 / gcc / Debug
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    steps:
      - name: Install OS packages
        run: |
          set -eux
          dnf -y install dnf-plugins-core epel-release
          dnf -y config-manager --set-enabled crb
          dnf -qy module disable postgresql
          dnf -y install \
            https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
          dnf -y install \
            postgresql18-devel \
            xerces-c-devel \
            libuuid-devel \
            cmake ninja-build gcc-c++ \
            java-17-openjdk-headless \
            git

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          set -eux
          /usr/pgsql-18/bin/pg_config --version
          cmake --version
          ninja --version
          java -version
          gcc --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG=/usr/pgsql-18/bin/pg_config

      - name: Build
        run: cmake --build build -j "$(nproc)"

  build-rocky-pg19:
    name: rockylinux:9 / gcc / Debug + tests (PG19)
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    steps:
      - name: Install OS packages
        # PG19 is still in development (19devel/19-alpha) so it lives in
        # pgdg-yum-testing, not the stable PGDG repo.  pgdg-redhat-repo-latest
        # ships a /etc/yum.repos.d/pgdg-redhat-all.repo with a disabled
        # `pgdg19-updates-testing` section -- enable it before installing.
        # perl-IPC-Run is needed by pg_regress.
        run: |
          set -eux
          dnf -y install dnf-plugins-core epel-release
          dnf -y config-manager --set-enabled crb
          dnf -qy module disable postgresql
          dnf -y install \
            https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
          dnf -y config-manager --set-enabled pgdg19-updates-testing
          dnf -y install \
            postgresql19 postgresql19-server postgresql19-contrib postgresql19-devel \
            xerces-c-devel \
            libuuid-devel \
            cmake ninja-build gcc-c++ \
            java-17-openjdk-headless \
            git diffutils \
            perl perl-IPC-Run

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          set -eux
          /usr/pgsql-19/bin/pg_config --version
          cmake --version
          ninja --version
          java -version
          gcc --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG=/usr/pgsql-19/bin/pg_config

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Run ORCA tests (--orca-tests)
        # pg_regress's --temp-instance calls initdb, which refuses to run as
        # root.  Create a regular user and hand over the workspace.
        run: |
          set -eux
          useradd -m runner
          chown -R runner:runner "$GITHUB_WORKSPACE"
          runuser -u runner -- bash -c '
            set -eux
            export PATH=/usr/pgsql-19/bin:$PATH
            cd "$GITHUB_WORKSPACE"
            test/test.sh --orca-tests
          '

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rocky-pg19-test-results
          path: |
            build/test_parallel/
            build/tmp_check_parallel/log/

  build-arm64:
    name: ubuntu-24.04-arm / gcc / Debug
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Add PostgreSQL apt repository (pgdg)
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=-
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo install -d /tmp/pgorca-apt-sources
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/pgorca-apt-sources/
          sudo cp /etc/apt/sources.list.d/pgdg.list /tmp/pgorca-apt-sources/
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/dev/null \
            -o Dir::Etc::sourceparts=/tmp/pgorca-apt-sources

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get install -y \
            postgresql-server-dev-18 \
            libxerces-c-dev \
            uuid-dev \
            default-jre-headless \
            cmake \
            ninja-build

      - name: Show toolchain versions
        run: |
          set -eux
          uname -m
          /usr/lib/postgresql/18/bin/pg_config --version
          cmake --version
          ninja --version
          java -version
          gcc --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG=/usr/lib/postgresql/18/bin/pg_config

      - name: Build
        run: cmake --build build -j "$(nproc)"

  build-macos:
    name: macos-latest / clang / Debug
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -eux
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew untap aws/tap || true
          brew install postgresql@18 xerces-c cmake ninja icu4c openjdk@17

      - name: Show toolchain versions
        run: |
          set -eux
          export JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$(brew --prefix postgresql@18)/bin/pg_config" --version
          cmake --version
          ninja --version
          java -version
          clang --version

      - name: Configure
        # Homebrew's postgresql@18 server headers include <unicode/ucol.h>,
        # which lives in keg-only icu4c.  Add icu4c's include/lib paths so
        # clang finds the ICU headers and the linker sees libicu*.
        run: |
          export JAVA_HOME="$(brew --prefix openjdk@17)/libexec/openjdk.jdk/Contents/Home"
          export PATH="$JAVA_HOME/bin:$PATH"
          ICU_PREFIX="$(brew --prefix icu4c)"
          export CPPFLAGS="-I${ICU_PREFIX}/include ${CPPFLAGS:-}"
          export LDFLAGS="-L${ICU_PREFIX}/lib ${LDFLAGS:-}"
          export PKG_CONFIG_PATH="${ICU_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPG_CONFIG="$(brew --prefix postgresql@18)/bin/pg_config"

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"
